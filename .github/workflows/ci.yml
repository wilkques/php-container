name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  # PHP 5.3 is the package's declared floor (composer.json: "php": ">=5.3");
  # 5.6 is the last PHP 5.x release and the most widely deployed one; 7.0 is
  # included here too because PHPUnit 9.6 (this package's require-dev)
  # requires PHP >=7.3, so `composer install` cannot even resolve on 7.0 —
  # see the "test" job below, which starts at 7.4. These three therefore
  # only prove src/ parses cleanly, via plain `docker run` (not GitHub's
  # `container:` job option), since the 5.3 image's glibc predates the
  # Node.js runtime the Actions runner injects into job containers and
  # would fail to bootstrap actions/checkout.
  syntax-check:
    name: "Syntax check (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '5.3'
            image: cespi/php-5.3:cli
          - php: '5.6'
            image: php:5.6-cli
          - php: '7.0'
            image: php:7.0-cli
    steps:
      - uses: actions/checkout@v4

      - name: Lint every file under src/ against PHP ${{ matrix.php }}
        run: |
          docker run --rm -v "$PWD":/app -w /app ${{ matrix.image }} sh -c '
            status=0
            for f in $(find src -name "*.php" | sort); do
              echo "== $f =="
              php -l "$f" || status=1
            done
            exit $status
          '

  test:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor here, not 7.0: PHPUnit 9.6 (require-dev) needs
        # PHP >=7.3, so anything below that can only be syntax-checked
        # above, not run through composer install + phpunit.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: vendor/bin/phpunit -c phpunit.xml
