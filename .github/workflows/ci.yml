name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 5.3 is the package's declared floor (composer.json:
        # "php": ">=5.3"). composer.json's require-dev pins
        # "phpunit/phpunit": "*", so composer resolves whichever major
        # version the running PHP can install — PHPUnit 4.8 on 5.3, up
        # through whatever's newest on 8.5 — and tests/TestCase.php picks
        # the right setUp()/tearDown() shape (and tests/Compat/*.php the
        # right assertion/expectation method names) for whatever actually
        # got installed, at runtime via reflection / method_exists() (see
        # tests/bootstrap.php). Individual tests that need syntax newer than
        # the PHP they're running under (nullable types, variadics, union
        # types, ...) skip themselves via PHP_VERSION_ID checks.
        #
        # 5.3 runs through shivammathur/setup-php@v2 the same as every
        # other version here, same as wilkques/php-helper, wilkques/cache,
        # and wilkques/config's own CI — it ships prebuilt binaries for
        # versions this old and already picks a Composer release compatible
        # with whatever PHP version it just installed, so no separate
        # Docker-based job or manual old-Composer download is needed.
        php: ['5.3', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: vendor/bin/phpunit -c phpunit.xml
